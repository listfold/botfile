name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ''
          - os: macos-14
            goos: darwin
            goarch: amd64
            suffix: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          CGO_ENABLED: 0
        run: |
          OUTPUT="botfile-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o "$OUTPUT" ./cmd/botfile
          sha256sum "$OUTPUT" > "botfile-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"
          tar -czf "botfile-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "$OUTPUT"

      - name: Calculate tarball checksums
        run: |
          sha256sum botfile-*.tar.gz > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          files: |
            botfile-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            botfile-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release tarball
        run: |
          mkdir release
          tar czf release/botfile-v${{ github.ref_name:0, 3 }}.tar.gz \
            -C artifacts .
          sha256sum release/botfile-v${{ github.ref_name:0, 3 }}.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/botfile-*/*.tar.gz
            artifacts/botfile-*/*.sha256
